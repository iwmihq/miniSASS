name: Build and push to ECR and deploy to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get timestamp
        id: ts
        run: |
          # Format: YYYY-MM-DD-HH-MM-SS
          TIME=$(date +'%Y-%m-%d-%H-%M-%S')
          echo "time=$TIME" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # these roles have been created on IAM. This was the first step completed.
          role-to-assume: arn:aws:iam::${{secrets.AWS_ACCOUNT_ID}}:role/GitHub-Actions-Production-Deployment-Role 
          aws-region: ${{secrets.AWS_DEPLOYMENT_REGION}}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Set Environment Tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "ENV=prod" >> $GITHUB_ENV
            echo "S3_MEDIA_BUCKET=minisass" >> $GITHUB_ENV
            echo "MINIO_AI_BUCKET=minisass" >> $GITHUB_ENV
            echo "MINIO_BUCKET=minisass" >> $GITHUB_ENV
          else
            echo "ENV=staging" >> $GITHUB_ENV
            echo "S3_MEDIA_BUCKET=minisass-staging" >> $GITHUB_ENV
            echo "MINIO_AI_BUCKET=minisass-staging" >> $GITHUB_ENV
            echo "MINIO_BUCKET=minisass-staging" >> $GITHUB_ENV
          fi

      - name: Build, tag and push Django Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: iwmi-minisass
          # tagging with the environment 'staging-datetime ''
          IMAGE_TAG: '${{ env.ENV }}-django-${{ steps.ts.outputs.time }}'
        run: |
          FULL_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          # to make it available in ECS step
          echo "FULL_IMAGE_URI=$FULL_IMAGE_URI" >> $GITHUB_ENV
          docker build -t "$FULL_IMAGE_URI" -f ./deployment/docker/Dockerfile .
          docker push "$FULL_IMAGE_URI"
       
      
      - name: Build, tag and push Tiles Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: iwmi-minisass
          # tagging with the environment 'staging-datetime ''
          IMAGE_TAG: '${{ env.ENV }}-pg_tileserv-${{ steps.ts.outputs.time }}'
        run: |
          FULL_TILES_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          # to make it available in ECS step
          echo "FULL_TILES_IMAGE_URI=$FULL_TILES_IMAGE_URI" >> $GITHUB_ENV
          docker build -t "$FULL_TILES_IMAGE_URI" -f ./deployment/docker-tiles/Dockerfile .
          docker push "$FULL_TILES_IMAGE_URI"
     
      
      - name: Build, tag and push NGINX Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: iwmi-minisass
          # tagging with the environment 'staging-datetime ''
          IMAGE_TAG: '${{ env.ENV }}-nginx-${{ steps.ts.outputs.time }}'
        run: |
          FULL_NGINX_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          # to make it available in ECS step
          echo "FULL_NGINX_IMAGE_URI=$FULL_NGINX_IMAGE_URI" >> $GITHUB_ENV
          docker build -t "$FULL_NGINX_IMAGE_URI"  -f ./deployment/docker-nginx/Dockerfile .
          docker push "$FULL_NGINX_IMAGE_URI"
      
   
      - name: Determine Secrets Configs
        id: secret
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "Using PRODUCTION config"
            echo "SECRET_ARN=arn:aws:secretsmanager:${{ secrets.AWS_DEPLOYMENT_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:secret:prod/minisass-pTZzPU" >> $GITHUB_ENV
            echo "CLUSTER_NAME=iwmi-prod-cluster-afsouth1" >> $GITHUB_ENV
          else
            echo "Using STAGING config"
            echo "SECRET_ARN=arn:aws:secretsmanager:${{ secrets.AWS_DEPLOYMENT_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:secret:staging/minisass-4L3Wd0" >> $GITHUB_ENV
            echo "CLUSTER_NAME=iwmi-staging-cluster-afsouth1" >> $GITHUB_ENV
          fi


      - name: Render task definition
        working-directory: deployment
        # replace the placeholder in the task definition with the URL to the new build on ECR
        run: |
          sed -i "s|<S3_MEDIA_BUCKET>|$S3_MEDIA_BUCKET|g" taskdef.json
          sed -i "s|<MINIO_AI_BUCKET>|$MINIO_AI_BUCKET|g" taskdef.json
          sed -i "s|<MINIO_BUCKET>|$MINIO_BUCKET|g" taskdef.json
          sed -i "s|<ECR_DJANGO_IMAGE_URI>|$FULL_IMAGE_URI|g" taskdef.json
          sed -i "s|<ECR_TILES_IMAGE_URI>|$FULL_TILES_IMAGE_URI|g" taskdef.json
          sed -i "s|<ECR_NGINX_IMAGE_URI>|$FULL_NGINX_IMAGE_URI|g" taskdef.json
          sed -i "s|<AWS_ACCOUNT_ID>|${{ secrets.AWS_ACCOUNT_ID }}|g" taskdef.json
          sed -i "s|<AWS_REGION>|${{ secrets.AWS_DEPLOYMENT_REGION }}|g" taskdef.json
          sed -i "s|<SECRET_ARN>|$SECRET_ARN|g" taskdef.json
          
      
      # Static files must reach S3 BEFORE the new tasks start serving.
      #
      # nginx proxies /static/ to the S3 bucket, but collectstatic writes to the
      # container's local filesystem, which nginx never reads in production.
      # Nothing bridged the two, so every object under static/ dated from the day
      # someone uploaded them by hand. Any frontend change therefore produced new
      # content-hashed bundle names that did not exist in S3, and the browser got
      # 403 for every asset: the page returned 200 while rendering completely blank.
      #
      # collectstatic is run inside the image that is about to be deployed, so the
      # uploaded files match the deployed code exactly rather than depending on a
      # separate build producing identical hashes.
      - name: Collect static files from the built image
        env:
          IMAGE: ${{ env.FULL_IMAGE_URI }}
        run: |
          mkdir -p ./collected-static
          docker run --rm \
            -e DJANGO_DB=unused -e POSTGRES_USER=unused -e POSTGRES_PASS=unused \
            -e DATABASE_HOST=unused -e DATABASE_PORT=5432 \
            -e MINIO_BUCKET="$MINIO_BUCKET" -e MINIO_AI_BUCKET="$MINIO_AI_BUCKET" \
            -e STATIC_ROOT=/home/web/static \
            -v "$PWD/collected-static":/out \
            --entrypoint bash "$IMAGE" -c \
            'cd /home/web/django_project && python manage.py collectstatic --noinput >/dev/null && cp -a /home/web/static/. /out/'
          echo "Collected $(find ./collected-static -type f | wc -l) static files"

      - name: Upload static files to S3
        run: |
          aws s3 sync ./collected-static/ "s3://${S3_MEDIA_BUCKET}/static/" \
            --no-progress
          echo "Static files synced to s3://${S3_MEDIA_BUCKET}/static/"

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: deployment/taskdef.json
          service: minisass-service
          cluster:  ${{ env.CLUSTER_NAME }}
          wait-for-service-stability: true
          